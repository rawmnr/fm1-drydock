[project]
name = "drydock-sync"
version = "0.1.0"
description = "CLI compagnon PC pour FM1-Drydock : télécharger les firmwares FM-1 et synchroniser le volume USB DRYDOCK."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.scripts]
drydock = "drydock_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drydock_sync"]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "ziglang>=0.14",  # cc hôte pour les tests bit-à-bit du protocole C sur Windows
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/drydock_sync"]
