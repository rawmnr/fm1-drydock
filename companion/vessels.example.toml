# Firmwares to sync onto the Drydock cartridge (drydock fetch + drydock sync).
# The official Stock V15 and the Rescue helper are synced automatically.
# Sources : firmware_hub (catalog id from thefirmwarehub.com), github, local.

[[vessel]]
id = "sloop"
source = "firmware_hub"

[[vessel]]
id = "felucca"
source = "firmware_hub"

[[vessel]]
id = "skiff"
source = "firmware_hub"

