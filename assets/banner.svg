    <rect x="190" y="168" width="120" height="52" rx="6" fill="url(#screenGrad)" stroke="#22d3ee" stroke-opacity="0.7"/>
    <polyline points="196,196 206,184 216,204 226,178 236,200 246,190 256,196 266,186 276,202 286,192 296,196 306,190" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="200" cy="240" r="10" fill="#0b1526" stroke="#64748b"/>
