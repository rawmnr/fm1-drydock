    <circle cx="566" cy="322" r="6" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="600" y="158" font-size="64" font-weight="800" letter-spacing="2" fill="#f1f5f9">FM1-<tspan fill="#22d3ee">DRYDOCK</tspan></text>
    <text x="600" y="196" font-size="19" fill="#9fb4d8">Standalone ESP32-S3 AMOLED firmware loader for the M-VAVE FM-1</text>
