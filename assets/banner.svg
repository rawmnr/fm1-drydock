  <path d="M0,334 C80,316 160,350 240,334 S400,316 480,334 S640,350 720,334 S880,316 960,334 S1120,350 1200,334 L1280,334 L1280,360 L0,360 Z" fill="#22d3ee" opacity="0.10"/>

